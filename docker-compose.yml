version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mindrefill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mindrefill
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mindrefill"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mindrefill-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/mindrefill?schema=public
      SESSION_SECRET: mindrefill-super-secure-production-session-secret-32-chars!
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      STORAGE_DRIVER: local
      RAZORPAY_KEY_ID: rzp_test_mock12345
      RAZORPAY_KEY_SECRET: rzp_test_secret12345
      RAZORPAY_WEBHOOK_SECRET: rzp_webhook_secret_mock12345
      GEMINI_API_KEY: mock_gemini_api_key_production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
